<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio de Exercícios HTML</title>
  <style>
    /* Estilos básicos para o site não ficar feio */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    header {
      text-align: center;
      padding: 20px 0;
      background-color: #2c3e50;
      color: white;
      border-radius: 8px;
      margin-bottom: 30px;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
    }

    .secao-aula {
      margin-bottom: 25px;
    }

    .container-exercicios {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .card-exercicio {
      background: white;
      padding: 15px;
      border-radius: 6px;
      border-left: 5px solid #3498db;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .card-exercicio h3 {
      margin-top: 0;
      color: #2c3e50;
    }

    .card-exercicio a {
      display: inline-block;
      margin-top: 10px;
      color: #3498db;
      text-decoration: none;
      font-weight: bold;
    }

    .card-exercicio a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <header>
    <h1>Meus Exercícios de HTML & CSS</h1>
    <p>Estudante: Seu Nome Completo | Turma: Informática 1A</p>
  </header>

  <main>
    <!-- Seção de exemplo para a primeira semana -->
    <section class="secao-aula">
      <h2>Módulo 1: Estrutura Básica</h2>

      <div class="container-exercicios">
        <!-- Card do Exercício 1 -->
        <div class="card-exercicio">
          <h3>Ex 01 - Primeira Página</h3>
          <p>Tags básicas de texto como h1, p e listas.</p>
          <a href="exercicio-01/index.html">Visualizar Exercício &rarr;</a>
        </div>

        <!-- Card do Exercício 2 -->
        <div class="card-exercicio">
          <h3>Ex 02 - Links e Imagens</h3>
          <p>Uso de caminhos relativos e tags de mídia.</p>
          <a href="exercicio-02/index.html">Visualizar Exercício &rarr;</a>
        </div>
      </div>
    </section>

    <!-- Você pode copiar a estrutura acima para os próximos módulos do professor -->
  </main>

</body>

</html>
